[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "science-story"
version = "0.4.0"
description = "Host-assisted Chinese science storytelling with evidence, original figures and verifiable exports"
requires-python = ">=3.10"
dependencies = []
license = {file = "LICENSE"}

[project.scripts]
science-story = "science_story.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
science_story = ["templates/*"]
